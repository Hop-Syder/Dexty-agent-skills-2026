<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#b000ff"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <g opacity="0.1" stroke="#00f5ff" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="650" y1="0" x2="650" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
  </g>

  <g transform="translate(80, 70)">
    <circle cx="130" cy="130" r="110" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
    <circle cx="130" cy="130" r="125" fill="none" stroke="#7000ff" stroke-width="1" stroke-dasharray="14 10" opacity="0.3" />

    <path d="M 60 70 L 130 50 L 190 90 L 210 160 L 170 210 L 100 210 L 60 140 Z" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
    <path d="M 60 70 L 140 130 L 170 210" fill="none" stroke="#b000ff" stroke-width="2.5" opacity="0.7"/>
    <path d="M 130 50 L 140 130 L 60 140" fill="none" stroke="#00f5ff" stroke-width="2.5" opacity="0.7"/>
    <path d="M 190 90 L 140 130 L 210 160" fill="none" stroke="#00f5ff" stroke-width="2.5" opacity="0.7"/>

    <path d="M 60 40 L 120 40 C 180 40, 220 80, 220 130 C 220 180, 180 220, 120 220 L 60 220 Z M 95 75 L 95 185 L 120 185 C 155 185, 185 160, 185 130 C 185 100, 155 75, 120 75 Z" fill="url(#cyanPurple)" opacity="0.85" filter="url(#glow)"/>

    <circle cx="60" cy="70" r="9" fill="#00f5ff" filter="url(#glow)" />
    <circle cx="130" cy="50" r="8" fill="#7000ff" filter="url(#glow)" />
    <circle cx="190" cy="90" r="10" fill="#00f5ff" filter="url(#glow)" />
    <circle cx="210" cy="160" r="8" fill="#b000ff" filter="url(#glow)" />
    <circle cx="170" cy="210" r="9" fill="#00f5ff" filter="url(#glow)" />
    <circle cx="100" cy="210" r="7" fill="#7000ff" filter="url(#glow)" />
    <circle cx="60" cy="140" r="8" fill="#00f5ff" filter="url(#glow)" />
    <circle cx="140" cy="130" r="12" fill="#ffffff" stroke="#00f5ff" stroke-width="3" filter="url(#glow)" />
  </g>

  <g transform="translate(370, 120)">
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Desty<tspan fill="#00f5ff"> 3.5</tspan>
    </text>

    <text x="5" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#00e5ff" letter-spacing="1.5">
      AUTONOMOUS FULLSTACK MULTI-AGENT ORCHESTRATOR
    </text>

    <text x="5" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Designed for Production &amp; Deterministic Software Delivery
    </text>

    <g transform="translate(5, 180)">
      <rect width="260" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="17" r="5" fill="#00f5ff"/>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
        POWERED BY NEXUS PARTNERS
      </text>
    </g>
  </g>
</svg>
