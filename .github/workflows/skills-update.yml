name: Dexty CI & Skills Watch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-regression-suite:
    name: Automated Security & Regression Suite (T1-T12b)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run Dexty automated test suite (T1-T12b + catalog/vendor invariants)
        run: bash tests/run_audit_tests.sh

  upstream-skills-watch:
    name: Weekly Upstream Skills Check & Scan
    needs: audit-regression-suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check upstream commits against catalog SHAs
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("skills.catalog.json", "r", encoding="utf-8") as f:
              cat = json.load(f)
          os.makedirs(".agents", exist_ok=True)
          with open(".agents/skills.lock", "w", encoding="utf-8") as lf:
              json.dump({"version": "3.5.1", "skills": cat["skills"]}, lf, indent=2)
          PY
          set +e
          bash tools/skills-check.sh . docs/scans/latest-upstream-check.json
          CODE=$?
          set -e
          if [ "$CODE" -eq 1 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload upstream check report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dexty-skills-check-report
          path: |
            docs/scans/latest-upstream-check.json
            .project-memory/SKILLS_UPDATE_REPORT.md

      - name: Create Pull Request on verified upstream updates
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: chore/dexty-skills-upstream-watch
          title: "chore(skills): rapport de mises à jour amont détectées"
          body: |
            Mise à jour détectée sur un ou plusieurs dépôts sources de `skills.catalog.json`.
            Voir `.project-memory/SKILLS_UPDATE_REPORT.md` et `docs/scans/latest-upstream-check.json` avant toute validation manuelle.
          commit-message: "chore(skills): update upstream check report"
          add-paths: |
            .project-memory/SKILLS_UPDATE_REPORT.md
            docs/scans/latest-upstream-check.json
